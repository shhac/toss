name: CI

on:
  push:
    branches: [main]
  pull_request:

# mlugg/setup-zig still declares `using: node20`, and its latest release
# (v2.2.1) has no node24 build yet. This pins the runtime to Node 24 now
# rather than inheriting whatever the runner defaults to. It does not
# silence the deprecation annotation -- that fires off the action's own
# declared runtime (actions/runner#4295) and clears when setup-zig ships
# a node24 release, or when Node 20 is removed on 2026-09-23.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src

      - name: Build
        run: zig build

      # --summary all prints the test count. Zig only discovers tests in the
      # root source file, so a suite that silently stops running would
      # otherwise still report success here.
      - name: Test
        run: zig build test --summary all

      - name: Cross-compile release targets
        run: |
          for target in \
            x86_64-linux-gnu \
            aarch64-linux-gnu \
            x86_64-macos \
            aarch64-macos \
            x86_64-windows
          do
            echo "==> $target"
            zig build -Doptimize=ReleaseSmall -Dtarget="$target"
          done
