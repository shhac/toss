name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon src

      - name: Build
        run: zig build

      # --summary all prints the test count. Zig only discovers tests in the
      # root source file, so a suite that silently stops running would
      # otherwise still report success here.
      - name: Test
        run: zig build test --summary all

      - name: Cross-compile release targets
        run: |
          for target in \
            x86_64-linux-gnu \
            aarch64-linux-gnu \
            x86_64-macos \
            aarch64-macos \
            x86_64-windows
          do
            echo "==> $target"
            zig build -Doptimize=ReleaseSmall -Dtarget="$target"
          done
